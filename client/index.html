    <style>
      body{margin:0;background:var(--background);color:var(--text-primary);font:400 16px/1.6 var(--font-body-family);-webkit-font-smoothing:antialiased}
      .initial-content{max-width:1180px;min-height:100vh;margin:0 auto;padding:36px 7vw 48px;color:var(--text-primary)}
      .initial-logo{width:96px;height:93px;object-fit:contain;margin:0 0 18px}
      .initial-eyebrow{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}
      .initial-content h1{max-width:780px;color:var(--brand-900);font-family:var(--font-display-family);font-size:clamp(44px,5.2vw,60px);font-weight:600;line-height:1.08}
      .initial-content h1 em{color:var(--brand-700)}
      .initial-content p{max-width:720px;font-size:17px;line-height:1.7}

  <body>
    <main class="initial-content" id="static-storefront-content">
      <img class="initial-logo" src="/prince-benja-designs-logo.png" alt="PRINCE BENJA DESIGNS logo" width="1054" height="1021" />
      <span class="initial-eyebrow">PRINCE BENJA DESIGNS · TRAVEL BAGS & ACCESSORIES</span>
      <h1>Ready for the <em>road ahead.</em></h1>
      <p>Travel bags and everyday essentials for wherever the day takes you.</p>
      <noscript><p>Enable JavaScript to view the interactive storefront.</p></noscript>

    <div id="root"></div>
    <script src="/api/platform/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
